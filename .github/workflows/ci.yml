name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kos
          POSTGRES_PASSWORD: kos
          POSTGRES_DB: keyvantic_kos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kos -d keyvantic_kos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql://kos:kos@localhost:5432/keyvantic_kos_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci_meili_master_key

    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from package.json's "packageManager" field —
      # passing `version` here too makes action-setup@v4 refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Build shared types package
        run: pnpm run build:types

      - name: Typecheck
        run: |
          pnpm --filter api run typecheck
          pnpm --filter web run typecheck

      - name: Lint
        run: |
          pnpm --filter api run lint
          pnpm --filter web run lint

      - name: Run database migrations
        run: pnpm --filter api exec prisma migrate deploy

      # The access-control tests must run as the unprivileged role the API uses in
      # production. Postgres exempts superusers from row-level security entirely, so
      # running them as the migration user would make every isolation test pass
      # while proving nothing.
      - name: Provision unprivileged application role
        run: |
          psql "$DATABASE_URL" -v app_password="'kos_app'" \
            -f apps/api/prisma/provision-app-role.sql

      - name: API tests
        run: pnpm --filter api run test
        env:
          DATABASE_URL: postgresql://kos_app:kos_app@localhost:5432/keyvantic_kos_test?schema=public

      - name: Build API
        run: pnpm --filter api run build

      - name: Build Web
        run: pnpm --filter web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t keyvantic-kos-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t keyvantic-kos-web:ci .
